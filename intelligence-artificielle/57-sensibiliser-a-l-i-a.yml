            creationdate: "01/02/2026"
            info: > 
             Après une introduction sur la thématique de l’IA (enjeux, potentiel, risques, impacts et limites), 
             cette conférence proposera une réflexion sur l’usage de l’IA dans les sciences actuelles et futures, 
             et donc pour la formation des futures générations de scientifiques.          
