            info: > 
             Ce support de présentation de formation est une introduction aux IA dans le contexte spécifique de l'enseignement supérieur 
             et de l’université. Destiné aux enseignants, il définit d'abord ce qu'est une IA, expose ensuite les biais 
             et limites de ces technologies et enfin il explore les dilemmes pédagogiques : potentiel d'individualisation des parcours, 
