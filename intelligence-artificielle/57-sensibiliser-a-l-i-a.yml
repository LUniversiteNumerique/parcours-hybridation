          - name: "FIDLE - « Atelier du Procès de l'IA »"
            type: "Cours complet"
            volume: "2h"
            url: "https://fidle.cnrs.fr/w3/proces_atelier.html"
            creationdate: "01/01/2026"
            info: > 
             Jeu de rôle participatif de FIDLE, développé à partir de la conférence théâtralisée « Procès de l'IA ». 
             Les participant.e.s incarnent les rôles du procès (procureur·e, avocat·e, juge, jury) et débattent des impacts, 
             enjeux et bénéfices de l'IA autour de thèmes comme l'environnement, les biais, l'emploi, la vie privée et la créativité. 
             Le groupe rend collectivement un verdict à l'issue du débat. Accessible à tout public sans prérequis en IA, 
             l'atelier favorise la prise de parole et la pensée critique. Un kit complet (rôles, fiches, guide d'animation) est téléchargeable, 
             et une formation d'animateur·rice est proposée par FIDLE.          
            licence:
              - name: "Citer l'auteur - Pas d’Utilisation Commerciale - Pas de Modification"
                image: "https://luniversitenumerique.fr/cc-licenses/images/badges/by-nc-nd.eu.svg"
