    ue:
      - name: "IA Cœur"
        resources:
          - name: "FIDLE - Parcours « Avancé »"
            type: "Cours complet"
            volume: "30h"
            url: "https://fidle.cnrs.fr/w3/parcours/02-avance.html"
            creationdate: "01/01/2024"
            info: > 
             Parcours vidéo de FIDLE (formation gratuite et ouverte à tous) pour développer une première expérience en Deep Learning. 
             Il couvre les briques fondamentales des réseaux de neurones (DNN, CNN, mathématiques et gradients) 
             ainsi que les architectures composites (encoder/decoder, GNN). Il aborde aussi les modèles les 
             plus récents : Transformers, LLM, modèles de diffusion et multimodaux. Le parcours traite également de méthodologie, 
             d'optimisation et de déploiement (inférence, edge AI). Une nouvelle saison est prévue fin 2026/début 2027 ; 
             en attendant, la saison 2024/25 reste accessible en archive (https://fidle.cnrs.fr/w3/archives/2024-2025.html (séquences 5 à 19).          
