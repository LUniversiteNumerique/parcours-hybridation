            volume: "20h"
            url: "https://www.fun-mooc.fr/fr/cours/brevetai-niveau-avance/"
            creationdate: "23/09/2025"
            info: >
              BrevetAI est un parcours accessible à toutes et à tous pour s'acculturer à l'IA. 
              Fondé sur l'apprentissage par le faire, il vous fait expérimenter les concepts à travers des activités pratiques.
               Vous y explorerez les notions clés (algorithmes, modèles, données, apprentissage), des tâches comme la classification 
               et le regroupement de données, les bonnes pratiques pour concevoir des modèles fiables et les bases de l'apprentissage profond. 
               Vous examinerez enfin les enjeux de l'IA : impacts environnementaux, cadre juridique, questions éthiques et défis scientifiques.        
