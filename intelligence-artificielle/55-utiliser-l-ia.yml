            info: >
              À l'ère où l'intelligence artificielle est intégrée dans de nombreux domaines, 
              de la recherche d'information à la création de contenu, 
              il devient essentiel de maîtriser le prompting, c'est à dire, 
              l'art de formuler des instructions (prompts) pour interagir efficacement 
              avec une intelligence artificielle générative.   
