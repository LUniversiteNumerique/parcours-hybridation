            info: >
             L’histoire de l’Intelligence Artificielle (IA) est avant tout une aventure humaine, 
             née du désir de conférer aux machines des compétences associées à l'intelligence, 
             notamment le langage et la capacité d'agir. Nous présentons cette histoire 
             non pas comme une succession de dates, mais comme une construction non linéaire, 
             façonnée par les influences culturelles, sociales, de découvertes scientifiques et d'innovations techniques       
