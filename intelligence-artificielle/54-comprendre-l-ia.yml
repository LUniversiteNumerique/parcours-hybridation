            volume: "1h30"
            url: "https://fidle.cnrs.fr/w3/sequences/03-Proces-de-lIA.html"
            creationdate: "01/11/2024"
            info: >
             La séquence suit le déroulé d'un procès : 
             présentation des faits, acte d'accusation, audition des témoins et experts, 
             plaidoirie de la défense, puis délibération du jury. Elle aborde ainsi les 
             grandes questions éthiques, économiques et sociales soulevées par l'IA. 
             Note : une attestation de suivi est délivrée aux formateurs qui suivent 
             le module sur la plateforme E-Formation (https://eformation.univ-grenoble-alpes.fr/course/search.php?search=fidle).            
            licence:
