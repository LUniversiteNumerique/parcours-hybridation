id: 54
name: "Comprendre l'IA"
description: |
  Ce parcours propose une sélection de ressources destinées à développer les connaissances et les compétences en intelligence artificielle, que ce soit dans le cadre d’enseignements, de formations ou en auto-formation.
  Les contenus abordent différentes thématiques liées à l’intelligence artificielle, afin de permettre à chacun de découvrir ses principaux concepts, de mieux comprendre ses usages et ses enjeux, et de progresser à son rythme.

years:
  - name: "Sensibilisation"
    ue:
      - name: "Sensibilisation"
        resources:
          - name: "FIDLE - Parcours « Découverte de l'IA », séquence « Concepts et histoire »"
            type: "Grain ou élément de cours"
            volume: "30min"
            url: "https://fidle.cnrs.fr/w3/sequences/01-Concepts.html"
            creationdate: "20/11/2025"
            info: >
             Parcours vidéo de la formation FIDLE (gratuite et ouverte à tous) consacré aux 
             origines et aux mécanismes de l'IA. Il retrace l'histoire de l'IA et 
             présente les grands paradigmes scientifiques ayant mené au Machine Learning 
             et au Deep Learning. Il explique la différence entre approches connexionniste 
             et symbolique, ainsi que le principe d'entraînement des IA 
             (des classificateurs d'images aux modèles comme ChatGPT ou Mistral). 
             Il aborde également ce que l'IA sait faire aujourd'hui et ses limites actuelles. 
             Enfin, il ouvre sur les évolutions futures des modèles et les notions d'AGI et d'ASI.     
            licence:
              - name: "Citer l'auteur - Pas d’Utilisation Commerciale - Pas de Modification"
                image: "https://luniversitenumerique.fr/cc-licenses/images/badges/by-nc-nd.eu.svg"
