            creationdate: "01/03/2026"
            info: >
             Ce MOOC est proposé par EFELIA - MIAI en collaboration avec le Centre d'Accompagnement de la Pédagogie (UGA). 
             Il explore 10 thématiques : marketing, création, droit, éthique, IA générative, 
             enjeux environnementaux, ressources humaines, information, santé et éducation. 
             Pour chaque thématique, des chercheur.euse.s présentent les apports, les limites et les points de 
             vigilance liés à l'IA. L'objectif est de comprendre le fonctionnement et les usages de l'IA, 
             ainsi que ses risques et limites.            
