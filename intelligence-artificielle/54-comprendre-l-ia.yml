            volume: "1h30"
            url: "https://eformation.univ-grenoble-alpes.fr/course/view.php?id=3524"
            creationdate: "05/07/2026"
            info: > 
             Support pédagogique autour d’un jeu de rôle à destination des enseignant.e.s afin de 
             les sensibiliser aux enjeux de l’IA à l’Université. 
             Son but est d’aider les enseignant.e.s à avoir une réflexion approfondie sur les avantages, 
             les limites et les implications éthiques des IA ainsi que sur l’adaptation des pratiques 
             pédagogiques à l’Université vis à vis de ces outils. 
             Il permet également d’avoir une vue d’ensemble sur ce que peut apporter 
             l’IA dans l’enseignement et ce que l’on peut faire avec.          
