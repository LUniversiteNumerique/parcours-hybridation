            creationdate: "23/09/2025"
            info: >
              BrevetAI est un parcours accessible à toutes et à tous pour 
              s'acculturer à l'IA. Fondé sur l'apprentissage par le faire, 
              il vous fait expérimenter les concepts à travers des activités 
              pratiques et des mises en situation. Vous y découvrirez les 
              notions clés qui expliquent le fonctionnement d'une IA et 
              vous examinerez aussi ses enjeux sociétaux : impacts 
              environnementaux, cadre juridique, questions éthiques et défis 
              scientifiques.        
