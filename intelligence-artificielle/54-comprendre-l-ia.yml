id: 54
name: "Comprendre l'IA"
description: |
  Ce parcours propose une sélection de ressources destinées à développer les connaissances et les compétences en intelligence artificielle, que ce soit dans le cadre d’enseignements, de formations ou en auto-formation.
  Les contenus abordent différentes thématiques liées à l’intelligence artificielle, afin de permettre à chacun de découvrir ses principaux concepts, de mieux comprendre ses usages et ses enjeux, et de progresser à son rythme.

years:
  - name: "Connaître l'histoire de l'IA"
    ue:
      - name: "Connaître l'histoire de l'IA"
        resources:
          - name: "Introduction à l'histoire de l'IA"
            type: "Grain ou élément de cours"
            volume: "30min"
            url: "https://microlearning.aniti.fr/nugget/introduction-a-lia-histoire-et-personnalites-influentes/view/e50aed66-2282-4477-b484-4886d88b5325"
            creationdate: "O1/04/2025"
            info: >
             Une exploration de l'histoire de l'intelligence artificielle 
             à partir d'événements clés et de portraits de personnalités marquantes.
            licence:
              - name: "Citer l'auteur - Pas d’Utilisation Commerciale - Pas de Modification"
                image: "https://luniversitenumerique.fr/cc-licenses/images/badges/by-nc-nd.eu.svg"
          - name: "L'histoire de l'IA"
            type: "Grain ou élément de cours"
            volume: "30min"
            url: "https://microlearning.aniti.fr/nugget/histoire-de-lia/view/8e540843-e5b5-4a07-a7fd-77c34a206e38#nugget_top"
            creationdate: "O1/04/2026"
            info: >
             L’histoire de l’Intelligence Artificielle (IA) est avant tout une aventure humaine, 
             née du désir de conférer aux machines des compétences associées à l'intelligence, 
             notamment le langage et la capacité d'agir. Nous présentons cette histoire 
             non pas comme une succession de dates, mais comme une construction non linéaire, 
             façonnée par les influences culturelles, sociales, de découvertes scientifiques et d'innovations techniques       
            licence:
              - name: "Citer l'auteur - Pas d’Utilisation Commerciale - Pas de Modification"
                image: "https://luniversitenumerique.fr/cc-licenses/images/badges/by-nc-nd.eu.svg"
          - name: "Les femmes dans l'histoire de l'IA"
            type: "Grain ou élément de cours"
            volume: "30min"
            url: "https://microlearning.aniti.fr/nugget/les-femmes-dans-lhistoire-de-linformatique-et-de-lia/view/44d1996e-3c45-4ab4-a75f-b417444c0e09#nugget_top"
            creationdate: "O1/05/2026"
            info: >
             Ce microlearning propose un voyage dans le temps pour 
             comprendre comment l’intelligence artificielle s’est construite, 
             depuis ses premières bases au XIXe siècle jusqu’aux enjeux actuels.            
            licence:
              - name: "Citer l'auteur - Pas d’Utilisation Commerciale - Pas de Modification"
                image: "https://luniversitenumerique.fr/cc-licenses/images/badges/by-nc-nd.eu.svg"
          - name: "FIDLE - Parcours « Découverte de l'IA », séquence « Concepts et histoire »"
            type: "Grain ou élément de cours"
            volume: "30min"
            url: "https://fidle.cnrs.fr/w3/sequences/01-Concepts.html"
            creationdate: "15/01/2026"
            info: >
             Parcours vidéo de la formation FIDLE (gratuite et ouverte à tous) consacré aux 
             origines et aux mécanismes de l'IA. Il retrace l'histoire de l'IA et 
             présente les grands paradigmes scientifiques ayant mené au Machine Learning 
             et au Deep Learning. Il explique la différence entre approches connexionniste 
             et symbolique, ainsi que le principe d'entraînement des IA 
             (des classificateurs d'images aux modèles comme ChatGPT ou Mistral). 
             Il aborde également ce que l'IA sait faire aujourd'hui et ses limites actuelles. 
             Enfin, il ouvre sur les évolutions futures des modèles et les notions d'AGI et d'ASI.     
            licence:
              - name: "Citer l'auteur - Pas d’Utilisation Commerciale - Pas de Modification"
                image: "https://luniversitenumerique.fr/cc-licenses/images/badges/by-nc-nd.eu.svg"

